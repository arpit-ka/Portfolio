<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="48%" stop-color="#2677FF"/>
      <stop offset="100%" stop-color="#D000FF"/>
    </linearGradient>
    <linearGradient id="k" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2545FF"/>
      <stop offset="55%" stop-color="#168DFF"/>
      <stop offset="100%" stop-color="#B800FF"/>
    </linearGradient>
    <radialGradient id="bg">
